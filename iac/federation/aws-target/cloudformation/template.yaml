AWSTemplateFormatVersion: "2010-09-09"
Description: >
  IAM OIDC Identity Provider and role for CUDly workload identity federation.
  Deploy this in the target AWS account to allow CUDly running on Azure or GCP
  to assume the role without long-lived credentials.

Parameters:
  OIDCIssuerURL:
    Type: String
    Description: >
      Full OIDC issuer URL (with https://) — used for the IAM OIDC provider Url property.
      Must NOT contain a trailing slash; the value here must match OIDCIssuerHost
      (minus the https:// prefix) exactly because AWS IAM condition keys are
      case-sensitive and string-equal.
      Azure AD: https://login.microsoftonline.com/<tenant_id>/v2.0
      GCP:      https://accounts.google.com
    AllowedPattern: "^https://[^/]+(/[^/]+)*$"
    ConstraintDescription: "OIDCIssuerURL must be https:// and must not contain a trailing slash."

  OIDCIssuerHost:
    Type: String
    Description: >
      OIDC issuer host and path WITHOUT the https:// prefix — used as the IAM
      condition key. Must equal OIDCIssuerURL with the https:// stripped and no
      trailing slash; the operator is responsible for keeping the two in sync.
      Azure AD: login.microsoftonline.com/<tenant_id>/v2.0
      GCP:      accounts.google.com
    AllowedPattern: "^[^/]+(/[^/]+)*$"
    ConstraintDescription: "OIDCIssuerHost must not start or end with a slash."

  OIDCAudience:
    Type: String
    Description: >
      Expected audience (aud) in the incoming OIDC token.
      Azure: api://<client_id>  or  <client_id>
      GCP:   https://iam.googleapis.com/projects/<project_number>/locations/global/workloadIdentityPools/<pool_id>/providers/<provider_id>
      Leaving this empty does NOT skip audience matching. Both the trust
      policy condition and the OIDC provider ClientIdList fall back to the
      literal string sts.amazonaws.com, so only tokens carrying exactly that
      audience are accepted.
    Default: ""
    AllowedPattern: "^$|^[^\\s*$]+$"
    ConstraintDescription: >
      OIDCAudience must be empty, or a string containing no whitespace, '$'
      or '*' anywhere.
      '$' is rejected because the trust policy is an IAM policy document and
      IAM expands ${...} policy variables inside Condition values: an audience
      of ${accounts.google.com:aud} would expand to the presented token's own
      aud claim and therefore match every token.
      '*' is rejected because StringEquals compares it literally rather than
      as a wildcard, silently producing a role nobody can assume.

  OIDCThumbprint:
    Type: String
    Description: >
      OPTIONAL. SHA-1 thumbprint (40 hex characters) of the top intermediate CA
      that signed the TLS certificate of the issuer's JWKS endpoint.
      LEAVE THIS EMPTY unless that certificate does not chain to a publicly
      trusted CA. Empty omits the ThumbprintList property entirely, and IAM then
      retrieves the correct thumbprint itself — the same thing the IAM console
      does by default.
      AWS verifies the JWKS endpoint's TLS certificate against its own library of
      trusted root CAs, and falls back to this thumbprint only when that
      certificate does not chain to one of them, when AWS cannot retrieve the
      certificate, or when the endpoint requires TLS 1.3. For both documented
      issuers (login.microsoftonline.com and accounts.google.com) the value is
      therefore never consulted, whatever it is set to.
      The all-zeros placeholder that used to be the default is now rejected. It
      does not disable chain verification — it is simply not the SHA-1 of any
      certificate, so on the fallback path it matches nothing and every
      AssumeRoleWithWebIdentity call fails. It nulls out the only check that
      path has while reading like a deliberate configuration.
      Note: when an issuer's discovery endpoint and jwks_uri are on different
      hosts, AWS requires the thumbprints of BOTH. This parameter carries a
      single value, so such an issuer must be onboarded with the AWS CLI or the
      IAM console instead of this template.
    Default: ""
    MaxLength: 40
    # Empty, or up to 40 hex characters of which at least one is non-zero.
    # The middle character class is what rejects the all-zeros placeholder: do
    # not "simplify" this back to ^$|^[0-9a-fA-F]{40}$, which readmits it.
    # MaxLength caps the upper end (the pattern alone would admit up to 79
    # characters). A well-formed-but-short value (1-39 hex) passes here and is
    # rejected by the IAM API, which fixes the length at 40 — fail-closed, with
    # the stack rolling back rather than deploying a broken provider.
    AllowedPattern: "^$|^[0-9a-fA-F]{0,39}[1-9a-fA-F][0-9a-fA-F]{0,39}$"
    ConstraintDescription: >
      OIDCThumbprint must be empty (recommended — IAM then retrieves the
      thumbprint itself), or a 40-character hex SHA-1 thumbprint containing at
      least one non-zero digit.
      The all-zeros placeholder is rejected because it is not the fingerprint of
      any certificate: whenever AWS actually falls back to thumbprint
      verification it matches nothing, so role assumption fails outright. Supply
      the issuer's real thumbprint, or leave this empty.

  OIDCSubjectClaim:
    Type: String
    Description: >
      REQUIRED. Subject (sub) claim identifying the single workload allowed to
      assume this role. There is deliberately no default: without a :sub
      condition the trust policy accepts EVERY identity the issuer can mint,
      so any tenant of that issuer could assume this role and place
      irreversible multi-year commitment purchases in this account.
      Azure AD managed identity: the object ID of the managed identity.
      GCP service account: the service account's numeric unique ID (typically
      21 digits; Google documents it as a numeric string without guaranteeing
      a length). That is the sub claim accounts.google.com actually issues; it
      is not the service account email.
      The system:serviceaccount:<namespace>:<name> form is the Kubernetes
      subject format and belongs to a cluster OIDC issuer, not to
      accounts.google.com.
      Mirrors the required oidc_subject_claim variable in the Terraform module.
    MinLength: 1
    AllowedPattern: "^[^\\s*$]+$"
    ConstraintDescription: >
      OIDCSubjectClaim is required and must be a non-empty string containing
      no whitespace, '$' or '*' anywhere.
      '$' is rejected because the trust policy below is an IAM policy document
      (Version 2012-10-17) and IAM expands ${...} policy variables inside
      Condition values. A subject of ${accounts.google.com:sub} would expand
      to the presented token's own sub claim, making the condition a tautology
      that matches EVERY identity the issuer can mint. That is exactly the
      hole this parameter exists to close, so it is rejected at submission
      time rather than deployed.
      '*' is rejected because StringEquals compares it literally rather than
      as a wildcard, silently producing a role nobody can assume.

  RoleName:
    Type: String
    Description: Name of the IAM role CUDly will assume.
    Default: CUDly-WIF

Conditions:
  HasAudience: !Not [!Equals [!Ref OIDCAudience, ""]]
  HasThumbprint: !Not [!Equals [!Ref OIDCThumbprint, ""]]

# Rules are evaluated before CloudFormation creates or updates any resource; a
# failed assertion aborts the stack operation. This duplicates the all-zeros
# rejection already encoded in the OIDCThumbprint AllowedPattern on purpose:
# the two are independent, so neither a regex "simplification" nor a submission
# path that skips one of the layers can readmit the placeholder on its own.
Rules:
  RejectPlaceholderThumbprint:
    Assertions:
      - Assert: !Not
          - !Equals
            - !Ref OIDCThumbprint
            - "0000000000000000000000000000000000000000"
        AssertDescription: >
          OIDCThumbprint must not be the all-zeros placeholder. It is not the
          SHA-1 fingerprint of any certificate, so on the one path where AWS
          still consults a thumbprint it matches nothing and every
          AssumeRoleWithWebIdentity call fails. Leave OIDCThumbprint empty to
          have IAM retrieve the real thumbprint, or supply the issuer's own.

Resources:
  OIDCProvider:
    Type: AWS::IAM::OIDCProvider
    Properties:
      Url: !Ref OIDCIssuerURL
      ClientIdList:
        - !If [HasAudience, !Ref OIDCAudience, sts.amazonaws.com]
      # Omitted entirely when OIDCThumbprint is empty, so IAM retrieves and uses
      # the issuer's real top intermediate CA thumbprint instead of whatever
      # placeholder the operator was handed. ThumbprintList is optional on
      # AWS::IAM::OIDCProvider and updates with no interruption, so switching
      # between the two forms never replaces the provider or changes its ARN.
      ThumbprintList: !If
        - HasThumbprint
        - [!Ref OIDCThumbprint]
        - !Ref "AWS::NoValue"

  CUDlyPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub "${RoleName}-Policy"
      Description: Permissions required by CUDly to purchase and manage AWS commitments
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: CostExplorer
            Effect: Allow
            Action:
              - ce:GetReservationPurchaseRecommendation
              - ce:GetReservationUtilization
              - ce:GetReservationCoverage
              - ce:GetSavingsPlansPurchaseRecommendation
              - ce:GetSavingsPlansUtilization
              - ce:GetSavingsPlansCoverage
            Resource: "*"
          - Sid: EC2Reservations
            Effect: Allow
            Action:
              - ec2:PurchaseReservedInstancesOffering
              - ec2:DescribeReservedInstancesOfferings
              - ec2:DescribeReservedInstances
              - ec2:DescribeInstanceTypeOfferings
              - ec2:GetReservedInstancesExchangeQuote
              - ec2:AcceptReservedInstancesExchangeQuote
              - ec2:DescribeRegions
            Resource: "*"
          - Sid: RDSReservations
            Effect: Allow
            Action:
              - rds:PurchaseReservedDBInstancesOffering
              - rds:DescribeReservedDBInstancesOfferings
              - rds:DescribeReservedDBInstances
            Resource: "*"
          - Sid: ElastiCacheReservations
            Effect: Allow
            Action:
              - elasticache:PurchaseReservedCacheNodesOffering
              - elasticache:DescribeReservedCacheNodesOfferings
              - elasticache:DescribeReservedCacheNodes
            Resource: "*"
          - Sid: RedshiftReservations
            Effect: Allow
            Action:
              - redshift:PurchaseReservedNodeOffering
              - redshift:DescribeReservedNodeOfferings
              - redshift:DescribeReservedNodes
            Resource: "*"
          - Sid: MemoryDBReservations
            Effect: Allow
            Action:
              - memorydb:PurchaseReservedNodesOffering
              - memorydb:DescribeReservedNodesOfferings
              - memorydb:DescribeReservedNodes
            Resource: "*"
          - Sid: SavingsPlans
            Effect: Allow
            Action:
              - savingsplans:CreateSavingsPlan
              - savingsplans:DescribeSavingsPlans
              - savingsplans:DescribeSavingsPlansOfferings
              - savingsplans:DescribeSavingsPlansOfferingRates
            Resource: "*"
          - Sid: OpenSearchReservations
            Effect: Allow
            Action:
              - es:PurchaseReservedInstanceOffering
              - es:DescribeReservedInstanceOfferings
              - es:DescribeReservedInstances
            Resource: "*"

  CUDlyRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Ref RoleName
      Description: Role assumed by CUDly via workload identity federation
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          # Both :aud and :sub are always enforced. There is intentionally no
          # subject-less variant of this statement: omitting :sub would trust
          # every identity the issuer can mint. OIDCSubjectClaim is a required
          # parameter, so this condition can never collapse to an empty match.
          - Effect: Allow
            Principal:
              Federated: !GetAtt OIDCProvider.Arn
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                !Sub "${OIDCIssuerHost}:aud":
                  !If [HasAudience, !Ref OIDCAudience, sts.amazonaws.com]
                !Sub "${OIDCIssuerHost}:sub": !Ref OIDCSubjectClaim
      ManagedPolicyArns:
        - !Ref CUDlyPolicy

Outputs:
  RoleARN:
    Description: ARN of the CUDly IAM role — use as aws_role_arn in CUDly account registration
    Value: !GetAtt CUDlyRole.Arn

  OIDCProviderARN:
    Description: ARN of the created OIDC identity provider
    Value: !GetAtt OIDCProvider.Arn

  CUDlyAccountRegistration:
    Description: Values to use when registering this account in CUDly
    Value: !Sub |
      provider               : aws
      aws_auth_mode          : workload_identity_federation
      external_id            : ${AWS::AccountId}
      aws_role_arn           : ${CUDlyRole.Arn}
      aws_web_identity_token_file : /var/run/secrets/token  (or set AWS_WEB_IDENTITY_TOKEN_FILE)

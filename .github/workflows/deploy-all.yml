# Deploy to All Cloud Providers in Parallel
#
# This workflow orchestrates deployment to multiple cloud providers simultaneously.
# Useful for disaster recovery, multi-cloud redundancy, or testing across platforms.
#
# Required GitHub Secrets:
#   - All secrets from individual deployment workflows (AWS, GCP, Azure)
#
# Required GitHub Variables:
#   - All variables from individual deployment workflows
#
# Triggered by:
#   - Manual workflow dispatch
#   - Release creation (deploys to prod across all clouds)

name: Deploy to All Clouds

# Adding a trigger here, or a second caller of the deploy-* workflows, means
# revisiting the `prepare` comments in deploy-azure.yml, deploy-gcp.yml and
# deploy-aws-lambda.yml. Since #1805 those three resolve their environment from
# `inputs.environment` and fall back on `github.event_name`, which inside a
# reusable workflow is whatever event started THIS run. They are correct today
# only because this workflow is their only caller, has no `push` trigger, and
# allowlists the environment it passes. A `push:` trigger here would make
# Azure and GCP silently resolve dev for a caller that asked for something
# else, which is #1805 restored.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        type: choice
        options:
          - dev
          - staging
          - prod
      deploy_to:
        description: 'Cloud providers to deploy to'
        required: true
        type: choice
        options:
          - all
          - aws-only
          - gcp-only
          - azure-only
          - aws-gcp
          - aws-azure
          - gcp-azure
  release:
    types: [created]

# None of the four `uses:` caller jobs below carries a `concurrency` group, and
# that is deliberate (#1801, #1806). The Terraform state guard is the group on
# each called workflow's own deploying job, which runs as a real job of THIS run
# and is serialized there. Putting the same group on a caller job would deadlock:
# the caller would hold the group while waiting on the inner job queued behind
# it. GitHub documents the sibling hazard for `cancel-in-progress: true` (sharing
# a group between caller and called cancels the already-running caller); at
# `false` it stalls instead. The per-job note on `deploy-azure` spells this out.
jobs:
  # Determine deployment strategy
  determine-deployment:
    name: Determine Deployment Strategy
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.set-env.outputs.environment }}
      deploy-aws-lambda: ${{ steps.set-clouds.outputs.deploy-aws-lambda }}
      deploy-aws-fargate: ${{ steps.set-clouds.outputs.deploy-aws-fargate }}
      deploy-gcp: ${{ steps.set-clouds.outputs.deploy-gcp }}
      deploy-azure: ${{ steps.set-clouds.outputs.deploy-azure }}

    steps:
      - name: Set environment
        id: set-env
        env:
          # This workflow is always the entry point of its own run, never a
          # reusable one, so `github.event_name` here really is the trigger that
          # started it. The called workflows cannot rely on that and read
          # `inputs.environment` instead (issue #1805).
          EVENT_NAME: ${{ github.event_name }}
          INPUT_ENVIRONMENT: ${{ inputs.environment }}
        run: |
          set -euo pipefail
          INPUT_ENVIRONMENT="${INPUT_ENVIRONMENT:-}"

          if [ "$EVENT_NAME" = release ]; then
            ENVIRONMENT=prod
          else
            ENVIRONMENT="$INPUT_ENVIRONMENT"
          fi

          # Every called workflow takes this value verbatim, so an empty or
          # unknown value has to stop the fan-out here rather than reach four
          # deployments.
          case "$ENVIRONMENT" in
            dev|staging|prod) ;;
            *)
              echo "::error::Refusing unknown environment: '$ENVIRONMENT'"
              exit 1
              ;;
          esac

          echo "environment=$ENVIRONMENT" >> "$GITHUB_OUTPUT"

      - name: Set cloud providers
        id: set-clouds
        run: |
          DEPLOY_TO="${{ inputs.deploy_to || 'all' }}"

          # AWS Lambda
          if [[ "$DEPLOY_TO" == "all" ]] || \
             [[ "$DEPLOY_TO" == "aws-only" ]] || \
             [[ "$DEPLOY_TO" == "aws-gcp" ]] || \
             [[ "$DEPLOY_TO" == "aws-azure" ]]; then
            echo "deploy-aws-lambda=true" >> $GITHUB_OUTPUT
          else
            echo "deploy-aws-lambda=false" >> $GITHUB_OUTPUT
          fi

          # AWS Fargate (optional, can be enabled separately)
          echo "deploy-aws-fargate=false" >> $GITHUB_OUTPUT

          # GCP
          if [[ "$DEPLOY_TO" == "all" ]] || \
             [[ "$DEPLOY_TO" == "gcp-only" ]] || \
             [[ "$DEPLOY_TO" == "aws-gcp" ]] || \
             [[ "$DEPLOY_TO" == "gcp-azure" ]]; then
            echo "deploy-gcp=true" >> $GITHUB_OUTPUT
          else
            echo "deploy-gcp=false" >> $GITHUB_OUTPUT
          fi

          # Azure
          if [[ "$DEPLOY_TO" == "all" ]] || \
             [[ "$DEPLOY_TO" == "azure-only" ]] || \
             [[ "$DEPLOY_TO" == "aws-azure" ]] || \
             [[ "$DEPLOY_TO" == "gcp-azure" ]]; then
            echo "deploy-azure=true" >> $GITHUB_OUTPUT
          else
            echo "deploy-azure=false" >> $GITHUB_OUTPUT
          fi

      - name: Display deployment plan
        run: |
          echo "## Deployment Plan" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** ${{ steps.set-env.outputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "**Deploy Strategy:** ${{ inputs.deploy_to || 'all' }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Clouds" >> $GITHUB_STEP_SUMMARY
          echo "- AWS Lambda: ${{ steps.set-clouds.outputs.deploy-aws-lambda }}" >> $GITHUB_STEP_SUMMARY
          echo "- AWS Fargate: ${{ steps.set-clouds.outputs.deploy-aws-fargate }}" >> $GITHUB_STEP_SUMMARY
          echo "- GCP Cloud Run: ${{ steps.set-clouds.outputs.deploy-gcp }}" >> $GITHUB_STEP_SUMMARY
          echo "- Azure Container Apps: ${{ steps.set-clouds.outputs.deploy-azure }}" >> $GITHUB_STEP_SUMMARY

  # Deploy to AWS Lambda
  deploy-aws-lambda:
    name: Deploy AWS Lambda
    needs: determine-deployment
    if: needs.determine-deployment.outputs.deploy-aws-lambda == 'true'
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/deploy-aws-lambda.yml
    with:
      environment: ${{ needs.determine-deployment.outputs.environment }}
    secrets:
      ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
      DASHBOARD_URL: ${{ secrets.DASHBOARD_URL }}
      FROM_EMAIL: ${{ secrets.FROM_EMAIL }}
      TF_BACKEND_AWS: ${{ secrets.TF_BACKEND_AWS }}

  # Deploy to AWS Fargate
  deploy-aws-fargate:
    name: Deploy AWS Fargate
    needs: determine-deployment
    if: needs.determine-deployment.outputs.deploy-aws-fargate == 'true'
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/deploy-aws-fargate.yml
    with:
      environment: ${{ needs.determine-deployment.outputs.environment }}
    secrets:
      ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
      TF_BACKEND_AWS: ${{ secrets.TF_BACKEND_AWS }}

  # Deploy to GCP Cloud Run
  deploy-gcp:
    name: Deploy GCP Cloud Run
    needs: determine-deployment
    if: needs.determine-deployment.outputs.deploy-gcp == 'true'
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/deploy-gcp.yml
    with:
      environment: ${{ needs.determine-deployment.outputs.environment }}
    secrets:
      ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
      TF_BACKEND_GCP: ${{ secrets.TF_BACKEND_GCP }}

  # Deploy to Azure Container Apps
  #
  # Deliberately carries no `concurrency` (#1801). The Terraform state guard is
  # the group on the called workflow's own build-and-deploy job, which runs as a
  # real job of this run and is serialized there. That group is derived from the
  # called workflow's own `prepare` output, which since #1805 is the
  # `environment` computed above verbatim: `prepare` takes the non-empty input
  # it is passed and fails the run rather than substituting a default.
  #
  # Putting that same group on this caller job would deadlock: this job would
  # hold the group while waiting on the inner job queued behind it. GitHub
  # documents the sibling hazard for `cancel-in-progress: true`: sharing a group
  # between caller and called cancels the already-running caller. At `false` it
  # stalls instead.
  deploy-azure:
    name: Deploy Azure Container Apps
    needs: determine-deployment
    if: needs.determine-deployment.outputs.deploy-azure == 'true'
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/deploy-azure.yml
    with:
      environment: ${{ needs.determine-deployment.outputs.environment }}
    secrets:
      ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      TF_BACKEND_AZURE: ${{ secrets.TF_BACKEND_AZURE }}

  # Aggregate results and notify
  notify:
    name: Deployment Results
    needs:
      - determine-deployment
      - deploy-aws-lambda
      - deploy-aws-fargate
      - deploy-gcp
      - deploy-azure
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Aggregate results
        run: |
          echo "## Multi-Cloud Deployment Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** ${{ needs.determine-deployment.outputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "**Timestamp:** $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### Deployment Status" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # AWS Lambda
          if [[ "${{ needs.determine-deployment.outputs.deploy-aws-lambda }}" == "true" ]]; then
            if [[ "${{ needs.deploy-aws-lambda.result }}" == "success" ]]; then
              echo "- ✅ AWS Lambda: Success" >> $GITHUB_STEP_SUMMARY
            else
              echo "- ❌ AWS Lambda: ${{ needs.deploy-aws-lambda.result }}" >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "- ⏭️ AWS Lambda: Skipped" >> $GITHUB_STEP_SUMMARY
          fi

          # AWS Fargate
          if [[ "${{ needs.determine-deployment.outputs.deploy-aws-fargate }}" == "true" ]]; then
            if [[ "${{ needs.deploy-aws-fargate.result }}" == "success" ]]; then
              echo "- ✅ AWS Fargate: Success" >> $GITHUB_STEP_SUMMARY
            else
              echo "- ❌ AWS Fargate: ${{ needs.deploy-aws-fargate.result }}" >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "- ⏭️ AWS Fargate: Skipped" >> $GITHUB_STEP_SUMMARY
          fi

          # GCP
          if [[ "${{ needs.determine-deployment.outputs.deploy-gcp }}" == "true" ]]; then
            if [[ "${{ needs.deploy-gcp.result }}" == "success" ]]; then
              echo "- ✅ GCP Cloud Run: Success" >> $GITHUB_STEP_SUMMARY
            else
              echo "- ❌ GCP Cloud Run: ${{ needs.deploy-gcp.result }}" >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "- ⏭️ GCP Cloud Run: Skipped" >> $GITHUB_STEP_SUMMARY
          fi

          # Azure
          if [[ "${{ needs.determine-deployment.outputs.deploy-azure }}" == "true" ]]; then
            if [[ "${{ needs.deploy-azure.result }}" == "success" ]]; then
              echo "- ✅ Azure Container Apps: Success" >> $GITHUB_STEP_SUMMARY
            else
              echo "- ❌ Azure Container Apps: ${{ needs.deploy-azure.result }}" >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "- ⏭️ Azure Container Apps: Skipped" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Check for failures
        run: |
          FAILED=false

          # determine-deployment is checked for anything other than success, not
          # just "failure". When it stops the run the four deploy jobs are
          # SKIPPED rather than failed, so testing only those would report "all
          # deployments completed successfully" for a run that deployed nothing.
          #
          # The four deploy jobs are deliberately still tested for "failure"
          # only. A CANCELLED run leaves them `cancelled` and reaches the
          # success line, which is the same false report. That predates this
          # change, so it is tracked in #1810 rather than fixed here.
          #
          # Note this step is the only success-by-default check in the repo. All
          # four per-cloud `summary` jobs allowlist on `== "success"` instead,
          # so an unenumerated result falls to their failure branch and errs
          # safe. This denylist is the outlier, not the pattern.
          if [[ "${{ needs.determine-deployment.result }}" != "success" ]] || \
             [[ "${{ needs.deploy-aws-lambda.result }}" == "failure" ]] || \
             [[ "${{ needs.deploy-aws-fargate.result }}" == "failure" ]] || \
             [[ "${{ needs.deploy-gcp.result }}" == "failure" ]] || \
             [[ "${{ needs.deploy-azure.result }}" == "failure" ]]; then
            FAILED=true
          fi

          if [ "$FAILED" = true ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "❌ **Deployment did not complete successfully. Check individual job logs.**" >> $GITHUB_STEP_SUMMARY
            exit 1
          else
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "✅ **All deployments completed successfully!**" >> $GITHUB_STEP_SUMMARY
          fi

      # Optional: Send notification to Slack, Discord, email, etc.
      # - name: Send notification
      #   if: always()
      #   uses: slackapi/slack-github-action@91efab103c0de0a537f72a35f6b8cda0ee76bf0a # v2.1.1
      #   with:
      #     method: chat.postMessage
      #     token: ${{ secrets.SLACK_BOT_TOKEN }}
      #     payload: |
      #       channel: ${{ secrets.SLACK_CHANNEL_ID }}
      #       text: "Multi-cloud deployment to ${{ needs.determine-deployment.outputs.environment }}: ${{ job.status }}"

# Deploy to Azure Container Apps
#
# This workflow deploys the CUDly application to Azure Container Apps.
# Serverless container platform with automatic scaling and built-in HTTPS.
#
# Required GitHub Secrets:
#   - AZURE_CLIENT_ID: App registration client ID for OIDC keyless auth
#   - AZURE_TENANT_ID: Azure AD tenant ID for OIDC keyless auth
#   - AZURE_SUBSCRIPTION_ID: Azure subscription ID
#   - ADMIN_EMAIL: Admin email for notifications
#
# Required GitHub Variables:
#   - AZURE_LOCATION: Azure region (e.g., eastus)
#   - ACR_NAME: Azure Container Registry name
#   - RESOURCE_GROUP: Azure resource group name
#   - KEY_VAULT_NAME: Azure Key Vault name
#
# Triggered by:
#   - Pushes to main branch
#   - Manual workflow dispatch
#   - Workflow call from deploy-all.yml

name: Deploy to Azure Container Apps

permissions:
  id-token: write
  contents: read

# No workflow-level `concurrency` on purpose. What needs protecting is the
# Terraform state blob, which is keyed on the environment, and only the
# job-level key can see `needs.prepare.outputs.environment` -- this level is
# limited to the `github`, `inputs` and `vars` contexts. Keying it on
# `github.ref` here was issue #1801: two refs resolving to the same environment
# landed in different groups and applied against one state file. See
# `build-and-deploy` below.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment'
        required: true
        type: choice
        options: [dev, staging, prod]
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
    secrets:
      ADMIN_EMAIL:
        required: true
      AZURE_CLIENT_ID:
        required: true
      AZURE_SUBSCRIPTION_ID:
        required: true
      AZURE_TENANT_ID:
        required: true
      TF_BACKEND_AZURE:
        required: true

env:
  AZURE_LOCATION: ${{ vars.AZURE_LOCATION || 'westus2' }}
  ACR_NAME: ${{ vars.ACR_NAME || 'cudlyacr' }}
  RESOURCE_GROUP: ${{ vars.RESOURCE_GROUP || 'cudly-rg' }}
  TF_VERSION: '1.10.0'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # Determine deployment environment
  prepare:
    name: Prepare Deployment
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.set-env.outputs.environment }}
    steps:
      - name: Determine environment
        id: set-env
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_ENVIRONMENT: ${{ inputs.environment }}
        run: |
          set -euo pipefail
          INPUT_ENVIRONMENT="${INPUT_ENVIRONMENT:-}"

          case "$EVENT_NAME" in
            workflow_dispatch|workflow_call) ENVIRONMENT="$INPUT_ENVIRONMENT" ;;
            *)                               ENVIRONMENT=dev ;;
          esac

          # workflow_dispatch constrains this to the declared `choice` options,
          # but the workflow_call input is typed as a free-form string, so the
          # allowlist is enforced here rather than assumed.
          case "$ENVIRONMENT" in
            dev|staging|prod) ;;
            *)
              echo "::error::Refusing unknown environment: $ENVIRONMENT"
              exit 1
              ;;
          esac

          echo "environment=$ENVIRONMENT" >> "$GITHUB_OUTPUT"

  # Build Docker image (via Terraform build module) and deploy
  build-and-deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    needs: prepare
    # Every run that writes github-<environment>.terraform.tfstate serializes
    # here, whatever its ref and whatever workflow it came from. The group name
    # is a 1:1 function of the state key, and the same literal prefix is used by
    # cleanup-staging.yml and rollback.yml, which write the same blob.
    #
    # `prepare` rejects anything outside dev|staging|prod and fails the run, so
    # this expression cannot evaluate to an empty suffix while this job runs --
    # that would collapse every environment into one group.
    #
    # cancel-in-progress stays false, stated explicitly rather than left to the
    # default: cancelling mid-`terraform apply` is how you get a half-applied
    # stack and a lease nobody releases.
    concurrency:
      group: azure-tfstate-${{ needs.prepare.outputs.environment }}
      cancel-in-progress: false
    outputs:
      app_url: ${{ steps.deploy.outputs.app_url }}
      app_name: ${{ steps.deploy.outputs.app_name }}
    env:
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    steps:
      - name: Checkout code
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Azure Login
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43 # v3.0.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}

      # This step used to also run `az storage blob lease break` on the state
      # blob, with no lease-age check and no --lease-break-period, so it broke a
      # *live* lease immediately. Removed with #1801: the lease is the last line
      # of defence against two writers, and a loud "Error acquiring the state
      # lock" is the correct outcome of a real collision. A genuinely stranded
      # lease (runner killed mid-apply) is recovered with `terraform
      # force-unlock <ID>`, using the lock ID Terraform prints in that error.
      - name: Write Terraform backend config
        env:
          TF_BACKEND: ${{ secrets.TF_BACKEND_AZURE }}
          ENVIRONMENT: ${{ needs.prepare.outputs.environment }}
        run: |
          printf '%s\nkey = "github-%s.terraform.tfstate"\n' "$TF_BACKEND" "$ENVIRONMENT" > /tmp/backend.tfbackend

      - name: Terraform Init
        run: |
          cd terraform/environments/azure
          terraform init -backend-config=/tmp/backend.tfbackend

      - name: Terraform Plan
        env:
          TF_VAR_admin_email: ${{ secrets.ADMIN_EMAIL }}
          TF_VAR_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          # pipefail for the same reason as the apply step below: the default
          # shell is `bash -e`, where a pipeline takes tee's exit status and a
          # failed plan would be reported as success.
          set -o pipefail
          cd terraform/environments/azure
          terraform plan \
            -var-file="github-${{ needs.prepare.outputs.environment }}.tfvars" \
            -var="location=${{ env.AZURE_LOCATION }}" \
            -out=tfplan 2>&1 | tee "${RUNNER_TEMP}/tf-plan.log"


      - name: Wait for resource group deletion to complete
        run: |
          ENVIRONMENT="${{ needs.prepare.outputs.environment }}"
          RG_NAME="cudly-${ENVIRONMENT}-rg"
          echo "Checking resource group ${RG_NAME} state..."
          for i in $(seq 1 30); do
            STATE=$(az group show --name "${RG_NAME}" --query "properties.provisioningState" -o tsv 2>/dev/null || echo "NotFound")
            if [ "$STATE" = "Deleting" ]; then
              echo "  Resource group is being deleted ($i/30), waiting 30s..."
              sleep 30
            else
              echo "  Resource group state: ${STATE} — proceeding"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "Timed out waiting for resource group deletion"
              exit 1
            fi
          done

      - name: Remove orphaned or soft-deleted Key Vault
        run: |
          ENVIRONMENT="${{ needs.prepare.outputs.environment }}"
          KV_NAME="cudly-${ENVIRONMENT}-kv"
          # If the KV exists in Azure but not in Terraform state (orphaned from a failed run),
          # delete it so Terraform can re-create it cleanly
          KV_RG=$(az keyvault show --name "${KV_NAME}" --query "resourceGroup" -o tsv 2>/dev/null || echo "")
          if [ -n "$KV_RG" ]; then
            echo "Key Vault ${KV_NAME} exists in Azure (rg: ${KV_RG}) — deleting so Terraform can recreate it"
            az keyvault delete --name "${KV_NAME}" --resource-group "${KV_RG}" 2>/dev/null || true
          fi
          # Purge any soft-deleted Key Vault (including the one we just deleted)
          # so the name can be immediately reused
          DELETED=$(az keyvault list-deleted --query "[?name=='${KV_NAME}'].name" -o tsv 2>/dev/null || echo "")
          if [ -n "$DELETED" ]; then
            echo "Purging soft-deleted Key Vault ${KV_NAME}..."
            az keyvault purge --name "${KV_NAME}" --location "${{ env.AZURE_LOCATION }}" 2>/dev/null \
              && echo "Purged" || echo "Purge failed (continuing)"
          fi

      - name: Terraform Apply
        id: deploy
        env:
          TF_VAR_admin_email: ${{ secrets.ADMIN_EMAIL }}
          TF_VAR_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          # pipefail is required: the default shell is `bash -e`, where a pipeline
          # takes tee's exit status and a failed apply would be reported as success.
          set -o pipefail
          cd terraform/environments/azure
          terraform apply -auto-approve tfplan 2>&1 | tee "${RUNNER_TEMP}/tf-apply.log"

          # Get app URL
          APP_URL=$(terraform output -raw container_app_url 2>/dev/null | grep -v '::' || echo "")
          echo "app_url=$APP_URL" >> $GITHUB_OUTPUT

          # Get app name
          APP_NAME=$(terraform output -raw container_app_name 2>/dev/null | grep -v '::' || echo "")
          echo "app_name=$APP_NAME" >> $GITHUB_OUTPUT

      # The provider fails the data read outright when the custom role is absent,
      # so a Terraform precondition can never run for this case. Issue #1794: the
      # Azure deploy failed on every main run since 2026-07-19 because the
      # bootstrap stack's role definition carried an action that does not exist
      # in Azure's operation catalog, so Azure rejected the whole role definition
      # with InvalidActionOrNotAction and the role was never created. That action
      # is removed in this PR. The message below still covers the general "role
      # missing" case for any future recurrence.
      - name: Explain a missing bootstrap role
        if: failure()
        run: |
          # Both logs are checked. Today the role lookup is deferred to apply --
          # the plan reports "will be read during apply (config refers to values
          # not yet known)" -- because of the module-level depends_on at
          # terraform/environments/azure/compute.tf:75. That is contingent, not
          # structural: if that stops forcing deferral the read moves to plan, and
          # the diagnostic should not have to move with it.
          #
          # Each file is checked separately so that "this log does not exist" is an
          # explicit, expected case at the point of reading -- either log is absent
          # when an earlier step failed first. Passing both to one grep would also
          # work (POSIX: -q exits 0 if a line is selected, and the only combinations
          # returning 2 are those with no match anywhere, where silence is wanted),
          # but it leaves that reasoning implicit.
          found=0
          for log in "${RUNNER_TEMP}/tf-plan.log" "${RUNNER_TEMP}/tf-apply.log"; do
            [ -f "$log" ] || continue
            if grep -qiE 'could not find role|Role Definition .* was not found' "$log"; then
              found=1
              break
            fi
          done
          [ "$found" -eq 1 ] || exit 0
          cat >&2 <<'EOT'
          ::error title=Missing bootstrap role::The custom reservation-purchaser role does not exist in this subscription.

          Apply the bootstrap stack that creates it:
              terraform/environments/azure/ci-cd-permissions

          Do NOT grant Microsoft.Authorization/roleDefinitions/write to the deploy
          service principal to work around this. The split is deliberate: this
          pipeline holds roleAssignments/write only.

          If the bootstrap HAS been applied, check in this order:
            1. the bootstrap stack's own apply log for InvalidActionOrNotAction.
               That means the role definition itself was rejected by Azure and
               never created, not merely unassigned (issue #1794's root cause:
               a nonexistent action in the role's actions list). Make sure the
               bootstrap module is on a commit that includes that fix.
            2. the deploy SP has Microsoft.Authorization/roleDefinitions/read.
               Without it the lookup returns empty, which is indistinguishable
               from the role being absent.
            3. the role was not renamed or deleted out of band.
            4. the name suffix still matches. The runtime module looks up
               "CUDly Reservation Purchaser (custom) - <subscription-id>";
               the bootstrap builds the name from its own var.name_suffix.
          EOT

      # A "Release state lock on failure" step used to break the lease here on
      # `failure() || cancelled()`. Removed with #1801. On failure Terraform
      # ordinarily unlocks on its way out, so the step usually did nothing; on
      # cancelled() a SIGINT'd apply is still shutting down and may still be
      # writing state, so it broke the lease out from under it. That is the
      # decisive half: a live lease must never be broken.
      #
      # The residue is real and is accepted, not denied. A lease IS stranded
      # when the unlock call itself fails ("Error releasing the state lock",
      # e.g. OIDC expiry mid-apply), when Terraform crashes, or when Actions
      # SIGKILLs after the cancellation grace period. The azurerm backend takes
      # an INFINITE lease, so none of those self-expire. Recovery is deliberate
      # and manual: `terraform force-unlock <ID>` with the ID Terraform prints.
      # A step that clears those cases can only do so by also breaking live
      # leases, which is the bug this issue is about.

      - name: Save deployment info
        run: |
          cat <<EOF > deployment-info.json
          {
            "environment": "${{ needs.prepare.outputs.environment }}",
            "app_url": "${{ steps.deploy.outputs.app_url }}",
            "app_name": "${{ steps.deploy.outputs.app_name }}",
            "deployed_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "deployed_by": "${{ github.actor }}",
            "commit": "${{ github.sha }}"
          }
          EOF
          cat deployment-info.json

      - name: Upload deployment info
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: deployment-info-azure-${{ needs.prepare.outputs.environment }}
          path: deployment-info.json
          retention-days: 90

  # Test the deployment
  test-deployment:
    name: Test Deployment
    runs-on: ubuntu-latest
    needs: [prepare, build-and-deploy]
    if: always() && needs.build-and-deploy.result == 'success'

    steps:
      - name: Azure Login
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43 # v3.0.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Get Container App URL
        id: get-url
        run: |
          APP_URL="${{ needs.build-and-deploy.outputs.app_url }}"
          if [ -z "$APP_URL" ]; then
            echo "Failed to get app URL from deploy outputs"
            exit 1
          fi
          # Ensure URL has scheme and no trailing slash
          case "$APP_URL" in
            http://*|https://*) ;; # already has scheme
            *) APP_URL="https://$APP_URL" ;;
          esac
          APP_URL="${APP_URL%/}"
          echo "url=$APP_URL" >> $GITHUB_OUTPUT

      - name: Wait for Container App to be ready
        run: |
          echo "Waiting 30 seconds for Container App to be ready..."
          sleep 30

      - name: Test health endpoint
        run: |
          URL="${{ steps.get-url.outputs.url }}"
          echo "Testing health endpoint: $URL/health"

          for i in {1..5}; do
            if curl -f -s "$URL/health" > /dev/null; then
              RESPONSE=$(curl -s "$URL/health")
              echo "Response: $RESPONSE"
              if echo "$RESPONSE" | grep -q '"status"'; then
                echo "Health check passed!"
                exit 0
              fi
            fi
            echo "Attempt $i failed, retrying in 10 seconds..."
            sleep 10
          done

          echo "Health check failed after 5 attempts"
          exit 1

      - name: Run smoke tests
        run: |
          URL="${{ steps.get-url.outputs.url }}"

          echo "Running basic smoke tests..."

          for i in {1..3}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL/health")
            if [ "$STATUS" -eq 200 ]; then
              echo "Health check $i: passed (HTTP $STATUS)"
            else
              echo "Health check $i: failed (HTTP $STATUS)"
              exit 1
            fi
            sleep 2
          done

          echo "All smoke tests passed!"

      - name: Check Container App logs
        run: |
          APP_NAME="${{ needs.build-and-deploy.outputs.app_name }}"
          if [ -n "$APP_NAME" ]; then
            echo "Recent Container App logs:"
            az containerapp logs show \
              --name $APP_NAME \
              --resource-group ${{ env.RESOURCE_GROUP }} \
              --tail 50 || true
          fi

  # Post deployment summary
  summary:
    name: Deployment Summary
    runs-on: ubuntu-latest
    needs: [prepare, build-and-deploy, test-deployment]
    if: always()

    steps:
      - name: Download deployment info
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: deployment-info-azure-${{ needs.prepare.outputs.environment }}
        continue-on-error: true

      - name: Post summary
        run: |
          echo "## Azure Container Apps Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** ${{ needs.prepare.outputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "**Location:** ${{ env.AZURE_LOCATION }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ -f deployment-info.json ]; then
            echo "### Deployment Details" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`json" >> $GITHUB_STEP_SUMMARY
            cat deployment-info.json >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Job Results" >> $GITHUB_STEP_SUMMARY
          echo "- Deploy: ${{ needs.build-and-deploy.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Test: ${{ needs.test-deployment.result }}" >> $GITHUB_STEP_SUMMARY

          if [ "${{ needs.build-and-deploy.result }}" == "success" ] && [ "${{ needs.test-deployment.result }}" == "success" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "✅ **Deployment successful!**" >> $GITHUB_STEP_SUMMARY
          else
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "❌ **Deployment failed. Check logs for details.**" >> $GITHUB_STEP_SUMMARY
          fi

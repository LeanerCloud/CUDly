# Cleanup Staging Resources (one-off)
#
# Destroys all resources tracked in the staging Terraform state files.
# Run this once after switching the default pipeline environment to 'dev'.
#
# Required GitHub Secrets (same as deploy workflows):
#   - TF_BACKEND_AWS, TF_BACKEND_AZURE, TF_BACKEND_GCP
#   - ADMIN_EMAIL
#   - AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID
#
# Required GitHub Variables:
#   - AWS_REGION, AWS_ROLE_TO_ASSUME
#   - GCP_PROJECT_ID, GCP_WORKLOAD_IDENTITY_PROVIDER, GCP_SERVICE_ACCOUNT

name: Cleanup Staging Resources

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "destroy" to confirm destruction of ALL staging resources'
        required: true

# Least privilege: `id-token: write` is granted per job, only to the four jobs
# that assume a cloud deploy role, and each of those is bound to the `staging`
# deployment environment. `guard` authenticates to nothing and must not hold it.
#
# IMPORTANT — what the `environment:` binding does and does not buy. It scopes
# secrets/vars and sets the OIDC subject to `repo:<org/repo>:environment:staging`.
# What each cloud does with that subject differs; see the per-job comments.
#
# It is NOT a reviewer gate. GitHub only blocks a job once required-reviewer
# protection rules are configured on the environment, and at the time of writing
# no environment in this repo has any. Note GitHub AUTO-CREATES a referenced
# environment bare on first use — no reviewers, no branch policy — so a binding
# to an environment nobody has configured runs straight through. Until that is
# configured out-of-band these destroy jobs still run unapproved. See #1660 for
# the live state; deliberately not restated here so this comment cannot rot into
# false reassurance.
#
# The environment subject is ref-agnostic, so the binding does not by itself keep
# this workflow on `main`. The `guard` job below checks the ref, but that check is
# defense-in-depth against ACCIDENTS ONLY and is NOT a security boundary:
# `workflow_dispatch` runs the workflow file as it exists on the dispatched ref, so
# anyone able to push a branch can delete the check and still present the
# `environment:staging` subject. The only control that survives that is a
# deployment branch policy, which GitHub evaluates before the job starts and
# before the token is minted. See #1660.
permissions:
  contents: read

env:
  TF_VERSION: '1.10.0'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  guard:
    name: Confirm Destruction
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      # An OIDC `sub` is EITHER `…:ref:refs/heads/<branch>` OR
      # `…:environment:<name>` -- never both (absent a custom sub-claim
      # template, and this repo sets none). So binding the destroy jobs to an
      # environment (below) REPLACES the ref-scoped subject with a ref-agnostic
      # one, and neither `dev` nor `staging` carries a deployment_branch_policy.
      # Without a ref check that trades a main-only restriction for any-branch
      # access -- a widening, on the workflow this change exists to narrow.
      #
      # This step catches the accidental case only. It is NOT a security
      # boundary: `workflow_dispatch` runs the workflow file as it exists on the
      # dispatched ref, so anyone who can push a branch can delete this step and
      # still present the `environment:staging` subject. The control that
      # survives that is a deployment branch policy on the environment
      # (custom_branch_policies + a `main` pattern), which GitHub evaluates
      # before the job starts and before the token is minted, and which does NOT
      # require `main` to be a protected branch. Tracked in #1660.
      - name: Restrict to main
        env:
          REF: ${{ github.ref }}
        run: |
          if [ "$REF" != "refs/heads/main" ]; then
            echo "::error::Refusing to destroy from '$REF'; this workflow may only be dispatched from refs/heads/main"
            exit 1
          fi

      - name: Check confirmation
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$CONFIRM" != "destroy" ]; then
            echo "You must type 'destroy' exactly to confirm. Got: '$CONFIRM'"
            exit 1
          fi
          echo "Confirmation accepted. Proceeding with staging resource destruction."

  destroy-aws-lambda:
    name: Destroy AWS Lambda (staging)
    runs-on: ubuntu-24.04-arm
    needs: guard
    permissions:
      id-token: write
      contents: read
    # AWS: role.tf's sub allowlist includes `environment:staging`, so this is
    # the subject the trust policy matches. Not a reviewer gate until
    # protection rules exist -- see the note at the top of this file.
    environment: staging
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@d979d5b3a71173a29b74b5b88418bfda9437d885 # v6.1.1
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init (staging state)
        env:
          TF_BACKEND: ${{ secrets.TF_BACKEND_AWS }}
        run: |
          printf '%s\nkey = "github-staging/terraform.tfstate"\n' "$TF_BACKEND" > /tmp/backend.tfbackend
          cd terraform/environments/aws
          terraform init -backend-config=/tmp/backend.tfbackend

      - name: Force-delete all staging ECR repos
        run: |
          for REPO in $(aws ecr describe-repositories \
            --query "repositories[?starts_with(repositoryName,'cudly-staging')].repositoryName" \
            --output text 2>/dev/null); do
            # Defense in depth: refuse anything outside the staging naming
            # pattern (in particular the bare 'cudly' prod-adjacent repo)
            # even if the query filter above is ever loosened.
            case "$REPO" in
              cudly-staging*) ;;
              *)
                echo "Refusing to delete non-staging ECR repo '$REPO'; staging cleanup only deletes cudly-staging* repos"
                exit 1
                ;;
            esac
            echo "Force-deleting ECR repo $REPO..."
            aws ecr delete-repository --repository-name "$REPO" --force 2>/dev/null \
              || echo "  Failed to delete $REPO (may already be gone)"
          done

      - name: Disable RDS deletion protection before destroy
        run: |
          for INSTANCE_ID in $(aws rds describe-db-instances \
            --query "DBInstances[?starts_with(DBInstanceIdentifier,'cudly-staging')].DBInstanceIdentifier" \
            --output text 2>/dev/null); do
            echo "Disabling deletion protection on $INSTANCE_ID..."
            aws rds modify-db-instance --db-instance-identifier "$INSTANCE_ID" \
              --no-deletion-protection --apply-immediately 2>/dev/null || true
          done

      - name: Terraform Destroy
        env:
          TF_VAR_admin_email: ${{ secrets.ADMIN_EMAIL }}
        run: |
          cd terraform/environments/aws
          terraform destroy \
            -var-file="github-staging.tfvars" \
            -var="compute_platform=lambda" \
            -auto-approve

  destroy-aws-fargate:
    name: Destroy AWS Fargate (staging)
    runs-on: ubuntu-24.04-arm
    needs: guard
    permissions:
      id-token: write
      contents: read
    # AWS: role.tf's sub allowlist includes `environment:staging`, so this is
    # the subject the trust policy matches. Not a reviewer gate until
    # protection rules exist -- see the note at the top of this file.
    environment: staging
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@d979d5b3a71173a29b74b5b88418bfda9437d885 # v6.1.1
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init (staging state)
        env:
          TF_BACKEND: ${{ secrets.TF_BACKEND_AWS }}
        run: |
          printf '%s\nkey = "github-fargate-staging/terraform.tfstate"\n' "$TF_BACKEND" > /tmp/backend.tfbackend
          cd terraform/environments/aws
          terraform init -backend-config=/tmp/backend.tfbackend

      - name: Force-delete all staging ECR repos
        run: |
          for REPO in $(aws ecr describe-repositories \
            --query "repositories[?starts_with(repositoryName,'cudly-staging')].repositoryName" \
            --output text 2>/dev/null); do
            # Defense in depth: refuse anything outside the staging naming
            # pattern (in particular the bare 'cudly' prod-adjacent repo)
            # even if the query filter above is ever loosened.
            case "$REPO" in
              cudly-staging*) ;;
              *)
                echo "Refusing to delete non-staging ECR repo '$REPO'; staging cleanup only deletes cudly-staging* repos"
                exit 1
                ;;
            esac
            echo "Force-deleting ECR repo $REPO..."
            aws ecr delete-repository --repository-name "$REPO" --force 2>/dev/null \
              || echo "  Failed to delete $REPO (may already be gone)"
          done

      - name: Disable RDS deletion protection before destroy
        run: |
          for INSTANCE_ID in $(aws rds describe-db-instances \
            --query "DBInstances[?starts_with(DBInstanceIdentifier,'cudly-staging')].DBInstanceIdentifier" \
            --output text 2>/dev/null); do
            echo "Disabling deletion protection on $INSTANCE_ID..."
            aws rds modify-db-instance --db-instance-identifier "$INSTANCE_ID" \
              --no-deletion-protection --apply-immediately 2>/dev/null || true
          done

      - name: Terraform Destroy
        env:
          TF_VAR_admin_email: ${{ secrets.ADMIN_EMAIL }}
        run: |
          cd terraform/environments/aws
          terraform destroy \
            -var-file="github-staging.tfvars" \
            -var="compute_platform=fargate" \
            -auto-approve

  destroy-azure:
    name: Destroy Azure (staging)
    runs-on: ubuntu-latest
    needs: guard
    # Shares the Azure Terraform state blob github-staging.terraform.tfstate
    # with deploy-azure.yml and rollback.yml, so it shares their concurrency
    # group: one writer per state file, whatever workflow or ref it came from
    # (#1801). The suffix is a literal because this job's state key is too.
    concurrency:
      group: azure-tfstate-staging
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read
    # Azure: REQUIRES the bootstrap module
    # terraform/environments/azure/ci-cd-permissions to have been re-applied
    # with `github_environments` including "staging". Until that manual apply
    # happens this job fails with AADSTS70021, because the only federated
    # credentials that exist are ref:refs/heads/main and pull_request (#1648).
    # Not a reviewer gate either -- see the note at the top of this file.
    environment: staging
    env:
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    steps:
      - name: Checkout code
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Azure Login
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43 # v3.0.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}

      # This step used to also break the blob lease on the state file, with no
      # age check and no --lease-break-period, so it broke a live lease held by
      # a concurrent writer. Removed with #1801; the job-level `concurrency`
      # group above is what keeps writers apart now, and a loud "Error acquiring
      # the state lock" is the correct outcome if one ever slips through.
      - name: Write Terraform backend config (staging state)
        env:
          TF_BACKEND: ${{ secrets.TF_BACKEND_AZURE }}
        run: |
          printf '%s\nkey = "github-staging.terraform.tfstate"\n' "$TF_BACKEND" > /tmp/backend.tfbackend

      - name: Terraform Init (staging state)
        run: |
          cd terraform/environments/azure
          terraform init -backend-config=/tmp/backend.tfbackend

      - name: Terraform Destroy
        env:
          TF_VAR_admin_email: ${{ secrets.ADMIN_EMAIL }}
          TF_VAR_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          cd terraform/environments/azure
          terraform destroy \
            -var-file="github-staging.tfvars" \
            -var="location=eastus" \
            -auto-approve

  destroy-gcp:
    name: Destroy GCP (staging)
    runs-on: ubuntu-latest
    needs: guard
    permissions:
      id-token: write
      contents: read
    # GCP: the WIF provider keys on assertion.repository and assertion.ref
    # only (gcp/ci-cd-permissions/github_oidc.tf:37), and the impersonation
    # binding is on attribute.repository -- nothing reads the subject. So this
    # binding does NOT affect whether the token mints; it is here for parity
    # and so protection rules can apply once they exist. GCP therefore stays
    # main-only via assertion.ref regardless.
    environment: staging
    env:
      GCP_REGION: ${{ vars.GCP_REGION || 'us-central1' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Authenticate to GCP
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init (staging state)
        env:
          TF_BACKEND: ${{ secrets.TF_BACKEND_GCP }}
        run: |
          printf '%s\nprefix = "github-staging"\n' "$TF_BACKEND" > /tmp/backend.tfbackend
          cd terraform/environments/gcp
          terraform init -backend-config=/tmp/backend.tfbackend

      - name: Delete Cloud SQL instance directly (avoids user/DB ordering deadlock)
        env:
          TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
        run: |
          # Routed via env: rather than interpolated into this script's source,
          # per the zero-expression-interpolation-in-run-blocks rule from #1641.
          PROJECT="$GCP_PROJECT_ID"
          # Validate the shape, not merely non-emptiness: a whitespace-only or
          # malformed value would otherwise reach `gcloud --project=`, match no
          # instance, and silently skip the deletion this step exists to perform.
          if ! printf '%s' "$PROJECT" | grep -Eq '^[a-z][a-z0-9-]{5,29}$'; then
            echo "::error::vars.GCP_PROJECT_ID is unset or malformed ('$PROJECT'); refusing to run Cloud SQL cleanup"
            exit 1
          fi
          # Find and delete the staging Cloud SQL instance to avoid PostgreSQL dependency errors
          INSTANCE=$(gcloud sql instances list --project="$PROJECT" \
            --filter="name:cudly-staging" --format="value(name)" 2>/dev/null | head -1)
          if [ -n "$INSTANCE" ]; then
            echo "Deleting Cloud SQL instance $INSTANCE..."
            gcloud sql instances delete "$INSTANCE" --project="$PROJECT" --quiet || true
            # Wait for deletion to complete (Service Networking Connection can't be removed until Cloud SQL is gone)
            echo "Waiting for Cloud SQL instance to be fully deleted..."
            for i in $(seq 1 30); do
              if ! gcloud sql instances describe "$INSTANCE" --project="$PROJECT" --quiet 2>/dev/null; then
                echo "Cloud SQL instance $INSTANCE deleted."
                break
              fi
              echo "Still deleting... ($i/30)"
              sleep 15
            done
          fi
          # Remove Cloud SQL resources from Terraform state so destroy doesn't try to delete them again
          cd terraform/environments/gcp
          terraform state rm google_sql_database_instance.main 2>/dev/null || true
          terraform state rm google_sql_database.main 2>/dev/null || true
          terraform state rm google_sql_user.main 2>/dev/null || true
          # Remove the Service Networking Connection from state and delete directly
          # GCP needs extra time after Cloud SQL deletion to release VPC peering
          terraform state rm module.networking.google_service_networking_connection.private_vpc_connection 2>/dev/null || true
          gcloud services vpc-peerings delete \
            --service=servicenetworking.googleapis.com \
            --network=cudly-staging-vpc \
            --project="$PROJECT" --quiet 2>/dev/null || echo "VPC peering already gone or not found"

      - name: Terraform Destroy
        env:
          TF_VAR_admin_email: ${{ secrets.ADMIN_EMAIL }}
          TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}
        run: |
          cd terraform/environments/gcp
          terraform destroy \
            -var-file="github-staging.tfvars" \
            -auto-approve

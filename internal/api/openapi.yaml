openapi: 3.0.3
info:
  title: CUDly API
  description: >
    CUDly is a multi-cloud commitment (Reserved Instances, Savings Plans)
    purchase automation and cost-optimization dashboard.
  version: "1.0.0"
  license:
    name: Proprietary

servers:
  - url: /
    description: Same-origin (relative)

# ---------------------------------------------------------------------------
# Security schemes
# ---------------------------------------------------------------------------
security:
  - bearerAuth: []

tags:
  - name: Dashboard
  - name: Configuration
  - name: Credentials
  - name: Recommendations
  - name: Plans
  - name: Purchases
  - name: PlannedPurchases
  - name: History
  - name: Analytics
  - name: Auth
  - name: APIKeys
  - name: Users
  - name: Groups
  - name: Health
  - name: Info
  - name: Docs

# ---------------------------------------------------------------------------
# Paths
# ---------------------------------------------------------------------------
paths:
  # ---- Dashboard ----------------------------------------------------------
  /api/dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [Dashboard]
      summary: Get dashboard summary
      parameters:
        - name: provider
          in: query
          description: Filter by cloud provider (aws, azure, gcp)
          schema:
            type: string
            enum: [aws, azure, gcp]
        - $ref: '#/components/parameters/AccountID'
        - $ref: '#/components/parameters/StartDate'
        - $ref: '#/components/parameters/EndDate'
      responses:
        '200':
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/dashboard/upcoming:
    get:
      operationId: getUpcomingPurchases
      tags: [Dashboard]
      summary: Get upcoming scheduled purchases
      responses:
        '200':
          description: Upcoming purchases
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpcomingPurchaseResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  # ---- Configuration ------------------------------------------------------
  /api/config:
    get:
      operationId: getConfig
      tags: [Configuration]
      summary: Get full configuration
      responses:
        '200':
          description: Current configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    put:
      operationId: updateConfig
      tags: [Configuration]
      summary: Update global configuration
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GlobalConfig'
      responses:
        '200':
          description: Updated configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/config/service/{service}:
    parameters:
      - name: service
        in: path
        required: true
        schema:
          type: string
          enum: [ec2, rds, elasticache, opensearch]
    get:
      operationId: getServiceConfig
      tags: [Configuration]
      summary: Get per-service configuration
      responses:
        '200':
          description: Service configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceConfig'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      operationId: updateServiceConfig
      tags: [Configuration]
      summary: Update per-service configuration
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceConfig'
      responses:
        '200':
          description: Updated service configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceConfig'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/commitment-options:
    get:
      operationId: getCommitmentOptions
      tags: [Configuration]
      summary: Dynamically-probed AWS commitment combinations
      description: |
        Returns the (term, payment) combinations AWS actually sells for
        commitment-capable services, harvested from the reserved-offerings
        APIs at most once per server lifetime and persisted to Postgres.
        When probe data is unavailable (no AWS account connected, probe
        failed, transient DB error) returns `{"status":"unavailable"}` at
        HTTP 200 so the frontend can fall back to hardcoded rules without
        tripping its error-toast path.
      responses:
        '200':
          description: Commitment options or unavailable status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommitmentOptionsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ---- Recommendations ----------------------------------------------------
  /api/recommendations:
    get:
      operationId: getRecommendations
      tags: [Recommendations]
      summary: List commitment purchase recommendations
      parameters:
        - name: provider
          in: query
          description: Filter by cloud provider (aws, azure, gcp)
          schema:
            type: string
            enum: [aws, azure, gcp]
        - name: service
          in: query
          schema:
            type: string
        - name: region
          in: query
          schema:
            type: string
        - $ref: '#/components/parameters/AccountID'
      responses:
        '200':
          description: Recommendations list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecommendationsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/recommendations/refresh:
    post:
      operationId: refreshRecommendations
      tags: [Recommendations]
      summary: Trigger a fresh collection of recommendations from cloud providers
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        '200':
          description: Collection result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  # ---- Purchase Plans -----------------------------------------------------
  /api/plans:
    get:
      operationId: listPlans
      tags: [Plans]
      summary: List purchase plans
      parameters:
        - name: status
          in: query
          schema:
            type: string
        - $ref: '#/components/parameters/AccountID'
      responses:
        '200':
          description: Plans list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlansResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: createPlan
      tags: [Plans]
      summary: Create a purchase plan
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              # target_accounts is required ONLY on plan creation. The shared
              # PlanRequest schema is reused by PUT/PATCH where omitting the
              # field means "leave the existing account list unchanged"; only
              # POST enforces non-empty target_accounts to prevent universal
              # plans. Scoping the requirement here (instead of in the shared
              # schema) keeps the update payload contract loose while still
              # advertising the create contract correctly to client codegen.
              allOf:
                - $ref: '#/components/schemas/PlanRequest'
                - type: object
                  required: [target_accounts]
      responses:
        '200':
          description: Created plan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchasePlan'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/plans/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceID'
    get:
      operationId: getPlan
      tags: [Plans]
      summary: Get a purchase plan by ID
      responses:
        '200':
          description: Purchase plan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchasePlan'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      operationId: updatePlan
      tags: [Plans]
      summary: Replace a purchase plan
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlanRequest'
      responses:
        '200':
          description: Updated plan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchasePlan'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: patchPlan
      tags: [Plans]
      summary: Partially update a purchase plan
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlanRequest'
      responses:
        '200':
          description: Patched plan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchasePlan'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: deletePlan
      tags: [Plans]
      summary: Delete a purchase plan
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/plans/{id}/purchases:
    parameters:
      - $ref: '#/components/parameters/ResourceID'
    post:
      operationId: createPlannedPurchases
      tags: [Plans]
      summary: Generate planned purchase executions for a plan
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePlannedPurchasesRequest'
      responses:
        '200':
          description: Planned purchases created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatePlannedPurchasesResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # ---- Purchase Actions ---------------------------------------------------
  /api/purchases/execute:
    post:
      operationId: executePurchase
      tags: [Purchases]
      summary: Create a purchase execution from selected recommendations
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExecutePurchaseRequest'
      responses:
        '200':
          description: Execution created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecutePurchaseResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/purchases/approve/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceID'
    post:
      operationId: approvePurchase
      tags: [Purchases]
      summary: Approve a pending purchase execution
      description: >
        Token-based approval; does not require session auth or CSRF.
      security: []
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Approved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/purchases/cancel/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceID'
    post:
      operationId: cancelPurchase
      tags: [Purchases]
      summary: Cancel a pending purchase execution
      description: >
        Token-based cancellation; does not require session auth or CSRF.
      security: []
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

  # ---- Planned Purchases --------------------------------------------------
  /api/purchases/planned:
    get:
      operationId: getPlannedPurchases
      tags: [PlannedPurchases]
      summary: List planned (scheduled) purchases
      parameters:
        - name: status
          in: query
          schema:
            type: string
        - name: plan_id
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Planned purchases
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlannedPurchasesResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/purchases/planned/{id}/pause:
    parameters:
      - $ref: '#/components/parameters/ResourceID'
    post:
      operationId: pausePlannedPurchase
      tags: [PlannedPurchases]
      summary: Pause a planned purchase
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        '200':
          description: Paused
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/purchases/planned/{id}/resume:
    parameters:
      - $ref: '#/components/parameters/ResourceID'
    post:
      operationId: resumePlannedPurchase
      tags: [PlannedPurchases]
      summary: Resume a paused planned purchase
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        '200':
          description: Resumed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/purchases/planned/{id}/run:
    parameters:
      - $ref: '#/components/parameters/ResourceID'
    post:
      operationId: runPlannedPurchase
      tags: [PlannedPurchases]
      summary: Immediately execute a planned purchase
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        '200':
          description: Execution initiated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunPurchaseResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/purchases/planned/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceID'
    delete:
      operationId: deletePlannedPurchase
      tags: [PlannedPurchases]
      summary: Cancel and delete a planned purchase
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        '200':
          description: Cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # ---- Generic Purchase Details -------------------------------------------
  /api/purchases/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceID'
    get:
      operationId: getPurchaseDetails
      tags: [Purchases]
      summary: Get details of a specific purchase execution
      responses:
        '200':
          description: Purchase execution details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseExecution'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # ---- RI Exchange --------------------------------------------------------
  /api/ri-exchange/instances:
    get:
      operationId: listConvertibleRIs
      tags: [RIExchange]
      summary: List convertible Reserved Instances eligible for exchange
      parameters:
        - $ref: '#/components/parameters/AccountID'
      responses:
        '200':
          description: Convertible RI list
          content:
            application/json:
              schema:
                type: object
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/ri-exchange/azure-instances:
    get:
      operationId: listExchangeableAzureRIs
      tags: [RIExchange]
      summary: List Azure Reserved Instances eligible for exchange
      parameters:
        - $ref: '#/components/parameters/AccountID'
      responses:
        '200':
          description: Azure exchangeable RI list
          content:
            application/json:
              schema:
                type: object
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/ri-exchange/azure-instances/compatible-offerings:
    post:
      operationId: getAzureCompatibleOfferings
      tags: [RIExchange]
      summary: Price a proposed Azure RI exchange and list compatible offerings
      description: >
        Requires `view:purchases` permission and `allowed_accounts` scope
        over the cloud account registered for `subscription_id`. Runs Azure
        CalculateExchange against the given source reservations and target
        SKUs and returns the priced candidate offerings plus a cost preview,
        without committing any financial transaction.

        Each target's billing scope is always derived from `subscription_id`.
        A target may omit `billing_scope_id`; supplying one that names a
        different subscription is a 400.
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [subscription_id, sources, targets]
              properties:
                subscription_id:
                  type: string
                sources:
                  type: array
                  minItems: 1
                  maxItems: 50
                  items:
                    $ref: '#/components/schemas/AzureExchangeSource'
                targets:
                  type: array
                  minItems: 1
                  maxItems: 50
                  items:
                    $ref: '#/components/schemas/AzureExchangeTarget'
      responses:
        '200':
          description: Compatible offerings and cost preview
          content:
            application/json:
              schema:
                type: object
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /api/ri-exchange/azure-instances/exchange:
    post:
      operationId: executeAzureExchange
      tags: [RIExchange]
      summary: Execute an Azure RI exchange (irreversible)
      description: >
        Requires `execute:ri-exchange` permission (deliberately separate from
        `execute:purchases`, mirroring the AWS execute endpoint) plus
        `allowed_accounts` scope over the cloud account registered for
        `subscription_id`. Each target's billing scope is derived from
        `subscription_id`, so the charge always lands on the account whose
        permission constraints were checked; a `billing_scope_id` naming a
        different subscription is a 400. The server
        re-runs CalculateExchange itself against the given sources/targets
        and only executes the fresh session that call returns -- a
        client-supplied session is never trusted. Execution is refused when
        the fresh quote carries policy errors, omits a net payable amount,
        is denominated in a different currency than requested, or exceeds
        `max_payment_due`.
        Submits are deduplicated for 15 minutes on a fingerprint of
        `subscription_id` plus the sources and targets with their quantities,
        so a retry after a client timeout returns 409 rather than committing
        the exchange a second time. The spend cap and currency are not part of
        that fingerprint: raising the cap does not make it a different
        purchase. See the 409 response: it does not assert that the earlier
        submit succeeded, only that it claimed the window.
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [subscription_id, sources, targets, max_payment_due, currency]
              properties:
                subscription_id:
                  type: string
                sources:
                  type: array
                  minItems: 1
                  maxItems: 50
                  items:
                    $ref: '#/components/schemas/AzureExchangeSource'
                targets:
                  type: array
                  minItems: 1
                  maxItems: 50
                  items:
                    $ref: '#/components/schemas/AzureExchangeTarget'
                max_payment_due:
                  type: string
                  description: Spend-cap guardrail (decimal string, e.g. "1000.00")
                currency:
                  type: string
                  description: ISO 4217 currency code the cap is denominated in
      responses:
        '200':
          description: Exchange executed
          content:
            application/json:
              schema:
                type: object
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /api/ri-exchange/target-offerings:
    get:
      operationId: listTargetOfferings
      tags: [RIExchange]
      summary: List available RI offerings to exchange into
      parameters:
        - $ref: '#/components/parameters/AccountID'
      responses:
        '200':
          description: Target offering list
          content:
            application/json:
              schema:
                type: object
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/ri-exchange/utilization:
    get:
      operationId: getRIUtilization
      tags: [RIExchange]
      summary: Get utilization metrics for Reserved Instances
      responses:
        '200':
          description: RI utilization data
          content:
            application/json:
              schema:
                type: object
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/ri-exchange/reshape-recommendations:
    get:
      operationId: getReshapeRecommendations
      tags: [RIExchange]
      summary: Get reshape recommendations for convertible RIs
      responses:
        '200':
          description: Reshape recommendation list
          content:
            application/json:
              schema:
                type: object
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/ri-exchange/quote:
    post:
      operationId: getExchangeQuote
      tags: [RIExchange]
      summary: Get a quote for an RI exchange before executing
      description: >
        Requires `view:purchases` permission. Returns the exchange valuation
        without committing any financial transaction.
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Exchange quote
          content:
            application/json:
              schema:
                type: object
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/ri-exchange/execute:
    post:
      operationId: executeRIExchange
      tags: [RIExchange]
      summary: Execute an RI exchange (irreversible)
      description: >
        Requires `execute:ri-exchange` permission. This is intentionally a
        separate, narrower permission from `execute:purchases` because RI
        exchanges submitted to AWS cannot be rolled back. Non-admin users must
        be explicitly granted `execute:ri-exchange` via a custom group; there
        is no default user-role grant.
        Submits are deduplicated for 15 minutes on a fingerprint of the
        deployment's cloud account and region plus the source RIs and targets
        with their counts, so a retry after a client timeout returns 409 rather
        than committing the exchange a second time. `max_payment_due_usd` is
        not part of that fingerprint: raising the cap does not make it a
        different purchase. See the 409 response: it does not assert that the
        earlier submit succeeded, only that it claimed the window.
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ri_ids, targets, max_payment_due_usd]
              properties:
                ri_ids:
                  type: array
                  items:
                    type: string
                targets:
                  type: array
                  items:
                    type: object
                max_payment_due_usd:
                  type: string
                  description: Spend-cap guardrail (decimal string, e.g. "1000.00")
      responses:
        '200':
          description: Exchange submitted
          content:
            application/json:
              schema:
                type: object
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/ri-exchange/config:
    get:
      operationId: getRIExchangeConfig
      tags: [RIExchange]
      summary: Get RI exchange configuration
      description: Requires `view:config` permission.
      responses:
        '200':
          description: RI exchange configuration
          content:
            application/json:
              schema:
                type: object
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    put:
      operationId: updateRIExchangeConfig
      tags: [RIExchange]
      summary: Update RI exchange configuration

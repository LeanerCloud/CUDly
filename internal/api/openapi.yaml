          format: double
        total_monthly_savings:
          type: number
          format: double
        total_annual_savings:
          type: number
          format: double

    PurchaseHistoryRecord:
      type: object
      properties:
        account_id:
          type: string
        purchase_id:
          type: string
        timestamp:
          type: string
          format: date-time
        provider:
          type: string
        service:
          type: string
        region:
          type: string
        resource_type:
          type: string
        count:
          type: integer
        term:
          type: integer
        payment:
          type: string
        upfront_cost:
          type: number
          format: double
        monthly_cost:
          type: number
          format: double
        estimated_savings:
          type: number
          format: double
        plan_id:
          type: string
        plan_name:
          type: string
        ramp_step:
          type: integer

    AnalyticsResponse:
      type: object
      properties:
        start:
          type: string
          format: date-time
        end:
          type: string
          format: date-time
        interval:
          type: string
        summary:
          $ref: '#/components/schemas/HistorySummary'
        data_points:
          type: array
          items:
            $ref: '#/components/schemas/HistoryDataPoint'

    HistoryDataPoint:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
        total_savings:
          type: number
          format: double
        total_upfront:
          type: number
          format: double
        purchase_count:
          type: integer
        cumulative_savings:
          type: number
          format: double
        by_service:
          type: object
          additionalProperties:
            type: number
            format: double
        by_provider:
          type: object
          additionalProperties:
            type: number
            format: double

    BreakdownResponse:
      type: object
      properties:
        dimension:
          type: string
        start:
          type: string
          format: date-time
        end:
          type: string
          format: date-time
        data:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/BreakdownValue'

    BreakdownValue:
      type: object
      properties:
        total_savings:
          type: number
          format: double
        total_upfront:
          type: number
          format: double
        purchase_count:
          type: integer
        percentage:
          type: number
          format: double

    # -- Health -------------------------------------------------------------
    HealthResponse:
      type: object
      properties:
        status:
          type: string
          enum: [healthy, degraded]
        timestamp:
          type: string
          format: date-time
        checks:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/HealthCheck'

    HealthCheck:
      type: object
      properties:
        status:
          type: string
          enum: [healthy, unhealthy]
        message:
          type: string

    # -- Info ---------------------------------------------------------------
    PublicInfoResponse:
      type: object
      description: >
        Unauthenticated public info. Only safe-to-expose fields are included.
        Sensitive identifiers (API key secret URL, AWS account ID) are served
        by the authenticated /api/info/deployment endpoint (#633).
      properties:
        version:
          type: string
        admin_exists:
          type: boolean

    DeploymentInfoResponse:
      type: object
      description: >
        Deployment-scoped identifiers. Requires AuthUser. Not accessible to
        unauthenticated callers (#633).
      properties:
        api_key_secret_url:
          type: string
          description: AWS Console deep-link to the Secrets Manager secret holding the API key.
        deployment_aws_account_id:
          type: string
          description: >
            AWS account ID of the CUDly Lambda deployment (from STS GetCallerIdentity).
            Present only on AWS-hosted deployments; omitted on Azure/GCP or when STS
            is unreachable. Used by the frontend to distinguish legitimate ambient-credential
            executions (cloud_account_id IS NULL because the rec targets this account)
            from orphan rows whose account was deleted (issue #608).
